name: Django API Code Quality Assurance

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  linter-check:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v3

      - name: Configurar Entorno Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Instalar Dependencias de Calidad
        run: |
          python -m pip install --upgrade pip
          pip install flake8 isort

      - name: Ejecutar Verificacion de Importaciones (isort)
        run: isort --check-only --profile black .

      - name: Ejecutar Analizador Estatico (flake8)
        run: flake8 .